<script src="/assets/worksheet/worksheet.js?v=6"></script>
<script>
/* This page only (the shared template is unchanged): the Emergency Fund numbers.
   Chapter 2: essentials total, share of take-home pay, six-month target (6 x essentials).
   Chapter 3: what's left after the $1,000 starter fund and how many months it takes at your monthly amount.
   Chapter 3 also: the full build including the time to finish the Chapter 4 starter fund (to go / moved each month, rounded up; 0 once at $1,000).
   Chapter 4: "Starter fund saved so far" is pre-filled from Chapter 1 "Savings you have now" (capped at $1,000) while it is empty; the reader can edit it.
   Chapter 8: the two transfers added up. Plan at a Glance: the same figures in one line.
   Plain ES5, like the template. */
(function () {
  var root = document.getElementById('zfg-worksheet');
  if (!root || !window.MutationObserver) return;
  var ESS = ['eHousing', 'eUtilities', 'eGroceries', 'eTransport', 'eInsurance', 'eDebtMins', 'eOther'];
  function amount(key) {
    var el = document.getElementById('f-' + key);
    var v = el ? String(el.value).replace(/[$,%\s]/g, '') : '';
    return v !== '' && !isNaN(+v) ? +v : null;
  }
  function dollars(x) {
    var r = Math.round(x);
    return '$' + String(r).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function figures() {
    var ess = 0, any = false;
    for (var i = 0; i < ESS.length; i++) { var a = amount(ESS[i]); if (a !== null) { ess += a; any = true; } }
    var o = { ess: any ? ess : null };
    o.target = any && ess > 0 ? ess * 6 : null;
    var pay = amount('takeHome');
    o.share = o.target && pay > 0 ? Math.round(ess / pay * 100) : null;
    var have = amount('savedNow'), base = Math.max(1000, have || 0);
    o.base = base; o.left = o.target !== null ? Math.max(0, o.target - base) : null;
    var per = amount('monthly');
    o.per = per;
    o.months = o.left !== null && per > 0 ? Math.ceil(o.left / per) : null;
    o.exact = o.left !== null && per > 0 ? Math.round(o.left / per * 10) / 10 : null;
    var ss = amount('starterSaved'), sm = amount('starterMonthly'), sLeft = Math.max(0, 1000 - (ss > 0 ? ss : 0));
    o.starterMonths = sLeft <= 0 ? 0 : (sm > 0 ? Math.ceil(sLeft / sm) : null);
    o.total = o.months !== null && o.starterMonths !== null ? o.months + o.starterMonths : null;
    var c = amount('autoCore'), s = amount('autoSide');
    o.transfers = c !== null || s !== null ? (c || 0) + (s || 0) : null;
    return o;
  }
  function anchorFor(afterKey) {
    // money fields have id "f-<key>"; the template's checkboxes have no id, so "#<section>" anchors to that section's first field
    if (afterKey.charAt(0) === '#') { var sec = document.getElementById(afterKey.slice(1)); return sec ? sec.querySelector('.ws-field') : null; }
    return document.getElementById('f-' + afterKey);
  }
  function line(id, afterKey) {
    var el = document.getElementById(id);
    if (el) return el;
    var anchor = anchorFor(afterKey), field = anchor;
    while (field && field.parentNode && !/\bws-field\b/.test(field.className || '')) field = field.parentNode;
    if (!field || !field.parentNode) return null;
    el = document.createElement('p'); el.id = id; el.className = 'ws-note'; el.setAttribute('aria-live', 'polite');
    field.parentNode.insertBefore(el, field.nextSibling);
    return el;
  }
  function set(el, text) { if (!el) return; el.textContent = text || ''; el.style.display = text ? '' : 'none'; }
  function texts(o) {
    var t = {};
    if (o.target) t.target = 'Essentials: ' + dollars(o.ess) + ' a month' + (o.share !== null ? ' (' + o.share + '% of take-home pay)' : '') +
      '. Six-month target: 6 x ' + dollars(o.ess) + ' = ' + dollars(o.target) + '.';
    if (o.target && o.months !== null) t.timeline = 'Still to save after the ' + (o.base > 1000 ? dollars(o.base) + ' you already have' : '$1,000 starter fund') + ': ' +
      dollars(o.left) + '. At ' + dollars(o.per) + ' a month, that takes about ' + o.months + ' month' + (o.months === 1 ? '' : 's') +
      ' (' + dollars(o.left) + ' ÷ ' + dollars(o.per) + ' = ' + o.exact + ', rounded up).' +
      (o.total !== null ? ' Add the time to finish your $1,000 starter fund, and the full build runs about ' + o.total + ' month' + (o.total === 1 ? '' : 's') + '.' : '');
    else if (o.target) t.timeline = 'Still to save after the ' + (o.base > 1000 ? dollars(o.base) + ' you already have' : '$1,000 starter fund') + ': ' + dollars(o.left) + '. Enter a monthly amount to see your timeline.';
    if (o.transfers !== null) t.transfers = 'Going to the fund each month: ' + dollars(o.transfers) + '.' +
      (o.per > 0 && Math.round(o.per) !== Math.round(o.transfers) ? ' Your Chapter 3 plan uses ' + dollars(o.per) + '.' : '');
    var g = [];
    if (o.target) g.push('Six-month target: ' + dollars(o.target));
    if (o.per > 0) g.push('saving ' + dollars(o.per) + ' a month');
    if (o.months !== null) g.push('about ' + o.months + ' months after the starter fund');
    if (g.length) t.glance = g.join(' · ') + '.';
    return t;
  }
  var busy = false;
  function refresh() {
    if (busy) return; busy = true;
    var t = texts(figures());
    set(line('ef-target', 'discretionary'), t.target);
    set(line('ef-timeline', 'monthly'), t.timeline);
    set(line('ef-transfers', 'autoSide'), t.transfers);
    set(line('ef-glance', '#conclusion'), t.glance);
    busy = false;
  }
  // Chapter 4 pre-fill: while "Starter fund saved so far" is empty (or still holds the page's own pre-fill), copy Chapter 1
  // "Savings you have now", capped at $1,000. Once the reader types their own amount it is never overwritten.
  var MARK = 'zfg-ef-starter-prefill';
  function getMark() { try { return window.localStorage.getItem(MARK); } catch (e) { return null; } }
  function setMark(v) { try { window.localStorage.setItem(MARK, v); } catch (e) {} }
  var seenStarter = null;
  function prefill() {
    var el = document.getElementById('f-starterSaved'), have = amount('savedNow');
    if (!el || have === null || have < 0) return;
    var v = String(Math.min(1000, have)), cur = String(el.value).trim();
    if (cur === v) return;
    if (cur === '' || cur === getMark()) {
      el.value = v; setMark(v);
      el.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }
  root.addEventListener('input', function (e) { if (e.target && e.target.id === 'f-savedNow') prefill(); });
  root.addEventListener('input', refresh);
  root.addEventListener('change', refresh);
  var LINES = [['ef-target', 'discretionary'], ['ef-timeline', 'monthly'], ['ef-transfers', 'autoSide'], ['ef-glance', '#conclusion']];
  new MutationObserver(function () {
    var st = document.getElementById('f-starterSaved');
    if (st && st !== seenStarter) { seenStarter = st; prefill(); }
    for (var i = 0; i < LINES.length; i++) if (!document.getElementById(LINES[i][0]) && anchorFor(LINES[i][1])) { refresh(); return; }
  }).observe(root, { childList: true, subtree: true });
  seenStarter = document.getElementById('f-starterSaved');
  prefill();
  refresh();

  // Print view (paper layout): the same figures as write-in lines, filled in when the screen shows them, blank otherwise.
  var printEl = document.getElementById('ws-print');
  function printRow(label, value) {
    var row = document.createElement('div'), lab = document.createElement('span'), val = document.createElement('span');
    row.className = 'p-row'; lab.className = 'p-lab'; val.className = 'p-line';
    lab.textContent = label; val.textContent = value || '';
    row.appendChild(lab); row.appendChild(val);
    return row;
  }
  function after(labelText, rows) {
    var labs = printEl.getElementsByTagName('span'), at = null;
    for (var i = 0; i < labs.length; i++) if (labs[i].className === 'p-lab' && labs[i].textContent === labelText) at = labs[i].parentNode;
    if (!at) return;
    for (var j = rows.length - 1; j >= 0; j--) at.parentNode.insertBefore(rows[j], at.nextSibling);
  }
  function printFigures() {
    if (!printEl || printEl.className !== 'paper' || document.getElementById('ef-print')) return;
    var o = figures();
    var r1 = printRow('Essentials per month', o.target ? dollars(o.ess) : ''); r1.id = 'ef-print';
    after('Discretionary spending', [r1, printRow('Six-month target (6 x essentials)', o.target ? dollars(o.target) : '')]);
    after('Saving each month', [printRow('Still to save after the starter fund', o.target ? dollars(o.left) : ''),
                                printRow('Months to reach the target', o.months !== null ? 'about ' + o.months : ''),
                                printRow('Months including the starter fund', o.total !== null ? 'about ' + o.total : '')]);
    after('Transfer from side income', [printRow('Total each month', o.transfers !== null ? dollars(o.transfers) : '')]);
    var hs = printEl.getElementsByTagName('h2');
    for (var i = 0; i < hs.length; i++) if (hs[i].textContent === 'Your Plan at a Glance') {
      var sec = hs[i].parentNode;
      sec.appendChild(printRow('Six-month target', o.target ? dollars(o.target) : ''));
      sec.appendChild(printRow('Saving each month', o.per > 0 ? dollars(o.per) : ''));
      sec.appendChild(printRow('Months after the starter fund', o.months !== null ? 'about ' + o.months : ''));
      sec.appendChild(printRow('Months including the starter fund', o.total !== null ? 'about ' + o.total : ''));
    }
  }
  if (window.ZFGWorksheet) window.ZFGWorksheet.afterPrint = printFigures;
  printFigures();
})();
</script>
