<script src="/assets/worksheet/worksheet.js?v=6"></script>
<script>
/* This page only (the shared template is unchanged): the Task Batching numbers, using the book's own steps.
   Chapter 1: gap to the 12-item target. Chapter 3: weekly task time (tasks x average minutes) and its share of the week.
   Chapter 5: list after the first 3 batches (log tasks - tasks moved + 3 batch items). Chapter 6: the 15% unscheduled buffer.
   Chapter 7: list after drop / automate / delegate. Chapter 8: list after merging + reduction from the start, and hours saved.
   Plan at a Glance: the same figures in one line. Plain ES5, like the template. */
(function () {
  var root = document.getElementById('zfg-worksheet');
  if (!root || !window.MutationObserver) return;
  function n(key) {
    var el = document.getElementById('f-' + key);
    var v = el ? String(el.value).replace(/[,\s]/g, '') : '';
    return v !== '' && !isNaN(+v) ? +v : null;
  }
  function r1(x) { return Math.round(x * 10) / 10; }
  function items(x) { return x + ' item' + (x === 1 ? '' : 's'); }
  function hrs(x) { var v = r1(x); return v + ' hour' + (v === 1 ? '' : 's'); }
  function figures() {
    var o = {};
    o.start = n('startCount');
    o.logged = n('loggedTasks'); o.avg = n('avgMinutes'); o.week = n('weekHours');
    o.taskHours = o.logged > 0 && o.avg > 0 ? o.logged * o.avg / 60 : null;
    o.base5 = o.logged > 0 ? o.logged : (o.start > 0 ? o.start : null);
    var moved = n('movedTasks');
    o.after5 = o.base5 !== null && moved !== null && moved >= 0 && moved <= o.base5 ? o.base5 - moved + 3 : null;
    o.buffer = o.week > 0 ? o.week * 0.15 : null;
    var d = n('cDrop'), a = n('cAuto'), g = n('cDeleg');
    o.cut7 = (d || 0) + (a || 0) + (g || 0);
    o.after7 = o.after5 !== null && (d !== null || a !== null || g !== null) ? Math.max(0, o.after5 - o.cut7) : null;
    var m = n('merged'), c = n('combined');
    o.after8 = o.after7 !== null && (m !== null || c !== null) ? Math.max(0, o.after7 - (m || 0) - (c || 0)) : null;
    o.now = o.after8 !== null ? o.after8 : (o.after7 !== null ? o.after7 : o.after5);
    o.hoursNow = n('taskHoursNow');
    return o;
  }
  function anchorFor(afterKey) {
    if (afterKey.charAt(0) === '#') { var sec = document.getElementById(afterKey.slice(1)); return sec ? sec.querySelector('.ws-field') : null; }
    return document.getElementById('f-' + afterKey);
  }
  function line(id, afterKey) {
    var el = document.getElementById(id);
    if (el) return el;
    var anchor = anchorFor(afterKey), field = anchor;
    while (field && field.parentNode && !/\bws-field\b/.test(field.className || '')) field = field.parentNode;
    if (!field || !field.parentNode) return null;
    el = document.createElement('p'); el.id = id; el.className = 'ws-note'; el.setAttribute('aria-live', 'polite');
    field.parentNode.insertBefore(el, field.nextSibling);
    return el;
  }
  function set(el, text) { if (!el) return; el.textContent = text || ''; el.style.display = text ? '' : 'none'; }
  function cut(from, to) { return from > to ? ' That is ' + (from - to) + ' fewer than the ' + from + ' you started with (' + Math.round((from - to) / from * 100) + '% shorter).' : ''; }
  function texts(o) {
    var t = {};
    if (o.start > 0) t.gap = o.start > 12 ? 'Target: about 12 items, ' + (o.start - 12) + ' fewer than now (' + Math.round((o.start - 12) / o.start * 100) + '% shorter).' : 'Your list is already at 12 items or fewer.';
    if (o.taskHours !== null) t.time = 'Task time: ' + o.logged + ' tasks x ' + o.avg + ' minutes = ' + hrs(o.taskHours) + ' a week' + (o.week > 0 ? ' (' + Math.round(o.taskHours / o.week * 100) + '% of your ' + o.week + '-hour week).' : '.');
    if (o.after5 !== null) t.l5 = 'Your list now: ' + o.base5 + ' - ' + n('movedTasks') + ' tasks moved + 3 batches = ' + items(o.after5) + '.';
    if (o.buffer !== null) t.buf = 'Keep 15% of your week unscheduled: 15% of ' + o.week + ' hours = ' + hrs(o.buffer) + '.';
    if (o.after7 !== null) t.l7 = 'Your list now: ' + o.after5 + ' - ' + o.cut7 + ' dropped, automated or delegated = ' + items(o.after7) + '.';
    if (o.after8 !== null) t.l8 = 'Your list now: ' + items(o.after8) + '.' + (o.start > 0 ? cut(o.start, o.after8) : '');
    if (o.taskHours !== null && o.hoursNow > 0) t.saved = 'Task time: from ' + hrs(o.taskHours) + ' to ' + hrs(o.hoursNow) + ' a week' + (o.taskHours > o.hoursNow ? ', about ' + hrs(o.taskHours - o.hoursNow) + ' saved.' : '.');
    var gl = [];
    if (o.start > 0 && o.now !== null) gl.push('List: ' + o.start + ' items at the start, ' + o.now + ' now');
    else if (o.start > 0) gl.push('List: ' + o.start + ' items at the start');
    if (o.taskHours !== null) gl.push('task time ' + hrs(o.taskHours) + (o.hoursNow > 0 ? ' → ' + hrs(o.hoursNow) : '') + ' a week');
    if (o.buffer !== null) gl.push('buffer ' + hrs(o.buffer));
    if (gl.length) t.glance = gl.join(' · ') + '.';
    return t;
  }
  var LINES = [['tb-gap', 'startCount', 'gap'], ['tb-time', 'weekHours', 'time'], ['tb-l5', 'movedTasks', 'l5'], ['tb-buf', 'lightDay', 'buf'],
               ['tb-l7', 'cDeleg', 'l7'], ['tb-l8', 'combined', 'l8'], ['tb-saved', 'taskHoursNow', 'saved'], ['tb-glance', '#conclusion', 'glance']];
  var busy = false;
  function refresh() {
    if (busy) return; busy = true;
    var t = texts(figures());
    for (var i = 0; i < LINES.length; i++) set(line(LINES[i][0], LINES[i][1]), t[LINES[i][2]]);
    busy = false;
  }
  root.addEventListener('input', refresh);
  root.addEventListener('change', refresh);
  new MutationObserver(function () {
    for (var i = 0; i < LINES.length; i++) if (!document.getElementById(LINES[i][0]) && anchorFor(LINES[i][1])) { refresh(); return; }
  }).observe(root, { childList: true, subtree: true });
  refresh();

  // Print view (paper layout): the same figures as write-in lines, filled in when the screen shows them, blank otherwise.
  var printEl = document.getElementById('ws-print');
  function printRow(label, value) {
    var row = document.createElement('div'), lab = document.createElement('span'), val = document.createElement('span');
    row.className = 'p-row'; lab.className = 'p-lab'; val.className = 'p-line';
    lab.textContent = label; val.textContent = value || '';
    row.appendChild(lab); row.appendChild(val);
    return row;
  }
  function after(labelText, rows) {
    var labs = printEl.getElementsByTagName('span'), at = null;
    for (var i = 0; i < labs.length; i++) if (labs[i].className === 'p-lab' && labs[i].textContent === labelText) at = labs[i].parentNode;
    if (!at) return;
    for (var j = rows.length - 1; j >= 0; j--) at.parentNode.insertBefore(rows[j], at.nextSibling);
  }
  function printFigures() {
    if (!printEl || printEl.className !== 'paper' || document.getElementById('tb-print')) return;
    var o = figures();
    var p1 = printRow('Weekly task time', o.taskHours !== null ? hrs(o.taskHours) : ''); p1.id = 'tb-print';
    after('Hours worked', [p1]);
    after('Tasks moved', [printRow('List after your first 3 batches', o.after5 !== null ? items(o.after5) : '')]);
    after('Lightest meeting day', [printRow('Unscheduled buffer (15% of your week)', o.buffer !== null ? hrs(o.buffer) : '')]);
    after('Delegate', [printRow('List after cutting', o.after7 !== null ? items(o.after7) : '')]);
    after('Batches combined', [printRow('List after merging', o.after8 !== null ? items(o.after8) : '')]);
    var hs = printEl.getElementsByTagName('h2');
    for (var i = 0; i < hs.length; i++) if (hs[i].textContent === 'Your Plan at a Glance') {
      var sec = hs[i].parentNode;
      sec.appendChild(printRow('Items at the start', o.start > 0 ? String(o.start) : ''));
      sec.appendChild(printRow('Items now', o.now !== null ? String(o.now) : ''));
      sec.appendChild(printRow('Weekly task time, before and now', o.taskHours !== null ? hrs(o.taskHours) + (o.hoursNow > 0 ? ' → ' + hrs(o.hoursNow) : '') : ''));
      sec.appendChild(printRow('Unscheduled buffer each week', o.buffer !== null ? hrs(o.buffer) : ''));
    }
  }
  if (window.ZFGWorksheet) window.ZFGWorksheet.afterPrint = printFigures;
  printFigures();
})();
</script>
