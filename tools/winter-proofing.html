<script>
/* This page only (the shared template is unchanged): dates written as "Oct 15, 2026", and the Chapter 10
   savings and payback line. Plain ES5, like the template. */
(function () {
  var root = document.getElementById('zfg-worksheet');
  if (!root || !window.MutationObserver) return;
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // "2026-10-15", "10/15/2026", "October 15 2026" or "oct 15, 2026" -> "Oct 15, 2026"; anything else stays as typed
  function tidyDate(v) {
    var s = String(v || '').replace(/^\s+|\s+$/g, ''), m, mo = -1, d, y;
    if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s))) { y = +m[1]; mo = +m[2] - 1; d = +m[3]; }
    else if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s))) { mo = +m[1] - 1; d = +m[2]; y = +m[3]; }
    else if ((m = /^([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})$/.exec(s))) {
      for (var i = 0; i < 12; i++) if (m[1].slice(0, 3).toLowerCase() === MON[i].toLowerCase()) mo = i;
      d = +m[2]; y = +m[3];
    }
    if (mo < 0 || mo > 11 || !(d >= 1 && d <= 31)) return s;
    return MON[mo] + ' ' + d + ', ' + y;
  }
  function tidyInput(el) {
    if (!el) return;
    var t = tidyDate(el.value);
    if (t === el.value) return;
    el.value = t;
    var ev;
    try { ev = new Event('input', { bubbles: true }); } catch (e) { ev = document.createEvent('Event'); ev.initEvent('input', true, true); }
    el.dispatchEvent(ev);   // the template saves on "input"
  }

  function amount(id) {
    var el = document.getElementById(id);
    var v = el ? String(el.value).replace(/[$,\s]/g, '') : '';
    return v !== '' && !isNaN(+v) ? +v : null;
  }
  function dollars(x) {
    var r = Math.round(x * 100) / 100;
    return '$' + (r % 1 ? r.toFixed(2) : String(r)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function payback() {
    var line = document.getElementById('wp-payback');
    if (!line) {
      var anchor = document.getElementById('f-newUsage');
      var field = anchor && anchor.parentNode;
      if (!field) return;
      line = document.createElement('p');
      line.id = 'wp-payback';
      line.className = 'ws-note';
      line.setAttribute('aria-live', 'polite');
      field.parentNode.insertBefore(line, field.nextSibling);
    }
    var spent = amount('f-spent'), before = amount('f-baseline'), after = amount('f-newSeason');
    var saved = before !== null && after !== null ? before - after : null;
    if (spent === null || saved === null || saved <= 0) { line.style.display = 'none'; line.textContent = ''; return; }
    line.textContent = 'Saved this season: ' + dollars(saved) + '. Payback: about ' + (Math.round(spent / saved * 10) / 10) +
      ' seasons (what you spent ÷ what you saved).';
    line.style.display = '';
  }

  var busy = false;
  function refresh() {
    if (busy) return;
    busy = true;
    tidyInput(document.getElementById('f-frostDate'));
    tidyInput(document.getElementById('f-huntDay'));
    payback();
    busy = false;
  }
  root.addEventListener('change', function (e) {
    if (e.target && (e.target.id === 'f-frostDate' || e.target.id === 'f-huntDay')) tidyInput(e.target);
  });
  root.addEventListener('input', payback);
  new MutationObserver(function () { if (!document.getElementById('wp-payback')) refresh(); }).observe(root, { childList: true, subtree: true });
  refresh();
})();
</script>
